name: Integration

# Layer 3 (contracts/testing-strategy.md, ADR 0024): real-cluster integration tests.
# Runs on merge to main and nightly, not on every push/PR. See test/integration/README.md
# for what this covers today and what's intentionally still missing (the full
# booth-module-store -> booth-core install-trigger scenario, blocked on booth-core
# publishing a pinned reference build per the testing-strategy contract).
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *" # nightly
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bundled-chart-refs-exist:
    # ADR 0111 item 6 / ADR 0113: a broken chartRef/chartVersion in bundled.yaml (a
    # typo'd module name, a version that was never actually released), or a pin to a
    # chart version that doesn't carry the identity-keys annotation, is a real
    # install-time failure mode, not a theoretical one. This runs the
    # integration-tagged Go test, which checks every non-empty entry resolves on the
    # real registry anonymously AND carries the ADR 0113 annotation (except the ids in
    # bundled_identitykeys_integration_test.go's identityKeysExemptIDs) — belongs here
    # (network-dependent, slower), not in the per-push/PR ci.yml's network-free unit
    # tests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@v4

      - name: Verify every bundled chartRef/chartVersion exists and carries the identity-keys annotation
        run: go test -tags integration -race -count=1 -v ./internal/catalog/... -run TestBundled_ChartRefsExistAndCarryIdentityKeys

  render-guard:
    # ARCHITECTURE.md item 68: the Install button installs a module through booth-core's
    # install API with no hand-set values at all — core supplies only the shared
    # identity settings a chart's own booth.projectbooth.io/identity-keys annotation
    # maps (ADR 0113/amendment 1), nothing else. booth-catalog 0.1.1 could not be
    # installed that way at all (a hand-made database Secret its manifest never
    # declared) and nothing in CI caught it until someone ran `helm template` by hand.
    # This renders every bundled chart the same way a Store install would — no values
    # beyond the stubbed identity keys, and a kube-version/capability set offline helm
    # can't otherwise see — so that failure mode is caught here instead of by the first
    # real user who clicks Install. Network-dependent (pulls each chart from the real
    # registry), so this runs here, not in ci.yml's per-push/PR, network-free unit tests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@v4

      - name: Render every bundled chart with only the values core would supply
        run: go test -tags integration -race -count=1 -v ./internal/catalog/... -run TestBundled_RendersWithOnlyCoreSuppliedValues

  kind-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: helm/kind-action@v1
        with:
          cluster_name: booth-module-store-ci

      - uses: azure/setup-helm@v4

      - name: Build and load booth-module-store image
        run: |
          docker build -t booth-module-store:ci .
          kind load docker-image booth-module-store:ci --name booth-module-store-ci

      - name: Install vendored BoothModule CRD (see test/integration/fixtures)
        run: kubectl apply -f test/integration/fixtures/boothmodule-crd.yaml

      - name: Install booth-module-store chart
        working-directory: charts/booth-module-store
        run: |
          helm install booth-module-store . \
            --namespace booth-system --create-namespace \
            --set image.repository=booth-module-store \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set oidc.issuerUrl=https://accounts.google.com \
            --set oidc.clientId=booth-module-store-ci \
            --set oidc.requireAudience=false \
            --wait --timeout 5m

      - name: Verify rollout and registration
        run: |
          kubectl -n booth-system get pods
          kubectl -n booth-system rollout status deployment/booth-module-store --timeout=120s
          kubectl -n booth-system get boothmodules.booth.projectbooth.io module-store -o yaml

      - name: Verify /healthz through the Service
        run: |
          kubectl -n booth-system run curl-check --rm -i --restart=Never --image=curlimages/curl -- \
            curl -sf http://booth-module-store.booth-system.svc.cluster.local:8080/healthz

      - name: Dump logs on failure
        if: failure()
        run: |
          kubectl -n booth-system get all
          kubectl -n booth-system logs deployment/booth-module-store --tail=200 || true
