name: Release

# ADR 0111's fleet-wide release mechanism: pushing a vX.Y.Z tag builds and publishes
# the container image and the Helm chart at that exact version, so a real install has
# a stable, versioned build to pin to instead of main (ARCHITECTURE.md's "a stable,
# versioned build other repos can pin to"). The chart is published two ways: attached
# as a .tgz to the GitHub release (offline use) and pushed as an OCI artifact to
# oci://ghcr.io/projectbooth/charts (what a real install, and booth-core's
# ParseChartRef/ADR 0028, actually resolve against — a GitHub release-asset URL isn't
# a chart reference booth-core understands).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/projectbooth/booth-module-store:${{ steps.version.outputs.version }}
            ghcr.io/projectbooth/booth-module-store:latest

  chart:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Package chart at the release version
        working-directory: charts/booth-module-store
        run: |
          helm package . \
            --version "${{ needs.image.outputs.version }}" \
            --app-version "${{ needs.image.outputs.version }}" \
            --destination ../../dist

      - name: Attach chart to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true

      - name: helm registry login (ghcr.io)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Push chart as an OCI artifact (ADR 0111)
        run: helm push dist/booth-module-store-${{ needs.image.outputs.version }}.tgz oci://ghcr.io/projectbooth/charts
