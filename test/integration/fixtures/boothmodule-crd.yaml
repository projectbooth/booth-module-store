# Vendored copy of booth-core's BoothModule CRD (charts/booth-core/crds/
# booth.projectbooth.io_boothmodules.yaml, ADR 0019). We don't own this type — core
# does — but our real-cluster integration test needs it present in the kind cluster to
# apply our own chart's BoothModule instance (templates/boothmodule.yaml).
#
# This is a stopgap until booth-core publishes a pinned, referenceable build our CI can
# install CRDs from directly (contracts/testing-strategy.md's "booth-core should
# publish a versioned, referenceable build other repos' CI can pin to" — not yet true
# as of this scaffold). Keep this in sync with booth-core's CRD by hand until then.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: boothmodules.booth.projectbooth.io
spec:
  group: booth.projectbooth.io
  names:
    kind: BoothModule
    listKind: BoothModuleList
    plural: boothmodules
    singular: boothmodule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BoothModule is the Kubernetes-native transport for a module's manifest
          (contracts/module-manifest.md), per ADR 0019. One instance per installed module,
          created/updated by that module's Helm chart on install, removed on uninstall.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BoothModuleSpec is the Kubernetes-native transport for contracts/module-manifest.md.
              Field-for-field, this must match that contract's table.
            properties:
              adminNavPath:
                type: string
              contractVersion:
                type: string
              displayName:
                type: string
              hasOwnUi:
                type: boolean
              healthCheckPath:
                type: string
              icon:
                type: string
              id:
                pattern: ^[a-z][a-z0-9-]*$
                type: string
              navGroup:
                enum:
                - build
                - view
                - manage
                type: string
              navPath:
                type: string
              requiredScopes:
                items:
                  type: string
                type: array
              serviceRef:
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                  port:
                    format: int32
                    type: integer
                required:
                - name
                - port
                type: object
              uiIntegrationMode:
                enum:
                - native
                - iframe-proxy
                type: string
              version:
                type: string
            required:
            - contractVersion
            - displayName
            - hasOwnUi
            - healthCheckPath
            - id
            - serviceRef
            - version
            type: object
          status:
            description: |-
              BoothModuleStatus is populated by booth-core's registry controller, never by the
              module itself.
            properties:
              lastHealthCheckTime:
                format: date-time
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
