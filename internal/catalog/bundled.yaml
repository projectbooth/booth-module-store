# Bundled catalog seed data (ADR 0027): every module in ../../../booth-architecture's
# MODULE_REGISTRY.md, minus the mandatory/foundation/meta rows (booth-architecture,
# booth-design, booth-core, booth-module-store itself, booth-e2e) — those aren't
# something a user installs from the Module Store, the same way you don't "install"
# the shell that's showing you the store.
#
# This must work with zero network access (ADR 0027) — it ships as part of this
# repo's own release and requires no external registry.
#
# `chart` is intentionally empty for every entry below: as of this seed, none of these
# module repos have published a Helm chart yet (MODULE_REGISTRY.md status: "not
# started" for all of them). Attempting to install an entry with no chart returns a
# clear error rather than guessing at a chart location — see internal/api's install
# handler. Fill in `chart` for a module once its repo publishes a real chart reference.
#
# `category` and `manifestPreview` are this repo's own best-effort classification,
# derived from ARCHITECTURE.md/MODULE_REGISTRY.md/ui-integration.md — not yet confirmed
# by each module's own agent. manifestPreview is explicitly informational-only per
# contracts/module-registry-protocol.md; the authoritative manifest is each module's own
# BoothModule CRD once installed.
#
# Keeping this file in sync with MODULE_REGISTRY.md as new modules are added is a
# manual step for now (ADR 0027's consequences section, flagged as v1 automation
# opportunity) — see docs/bundled-catalog-sync.md for a proposed approach.

