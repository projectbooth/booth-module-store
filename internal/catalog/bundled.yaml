# Bundled catalog seed data (ADR 0027): every module in ../../../booth-architecture's
# MODULE_REGISTRY.md, minus the mandatory/foundation/meta rows (booth-architecture,
# booth-design, booth-core, booth-module-store itself, booth-e2e) — those aren't
# something a user installs from the Module Store, the same way you don't "install"
# the shell that's showing you the store.
#
# This must work with zero network access (ADR 0027) — it ships as part of this
# repo's own release and requires no external registry. chartRef/chartVersion below
# point at a real, already-published oci:// chart (ADR 0111's release train); only the
# actual install call needs network access, browsing this bundled list never does.
#
# chartRef/chartVersion (ADR 0111, ADR 0028): the real published location of each
# module's released Helm chart — oci://ghcr.io/projectbooth/charts/<chart> plus its
# version, exactly the wire shape module-registry-protocol.md uses for a registry
# entry, passed through to booth-core unparsed. Left empty for a module with no
# published chart yet (superset, metabase as of this seed) — listed so a user can see
# it exists, but not installable until one exists; see internal/api's install handler
# for the resulting error.
#
# `category` and `manifestPreview` are this repo's own best-effort classification,
# derived from ARCHITECTURE.md/MODULE_REGISTRY.md/ui-integration.md — not yet confirmed
# by each module's own agent. manifestPreview is explicitly informational-only per
# contracts/module-registry-protocol.md; the authoritative manifest is each module's own
# BoothModule CRD once installed.
#
# Keeping this file in sync with MODULE_REGISTRY.md as new modules are added is a
# manual step for now (ADR 0027's consequences section, flagged as v1 automation
# opportunity) — see docs/bundled-catalog-sync.md for a proposed approach. This pass
# (ADR 0111 item 6) also added booth-lakehouse and booth-database, both real
# module-type MODULE_REGISTRY.md rows with a published chart that this file had simply
# never been updated to include — not a deliberate exclusion, a staleness gap (both
# were added to MODULE_REGISTRY.md on 2026-09-28, after this file's last manual sync).

