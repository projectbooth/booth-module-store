apiVersion: v2
name: booth-module-store
description: >
  Project Booth's mandatory Module Store: the catalog of installable modules (bundled +
  optional external registries) and the browsing/install UI, calling booth-core's
  install/uninstall API.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/projectbooth/booth-module-store

# ADR 0113 / contracts/module-manifest.md "Chart annotation: identity keys": tells
# booth-core's install API which of this chart's values.yaml paths carry the platform's
# shared identity settings, so a module installed through the install API (the Module
# Store's Install button included) is configured without hand-typed values. Core fills a
# mapped path only when the request doesn't already set it. This chart has no workload
# identity or iframe-identity issuer setting, so workloadIssuerUrl/iframeIssuerUrl are
# omitted.
annotations:
  booth.projectbooth.io/identity-keys: |
    {"issuerUrl":"oidc.issuerUrl","clientId":"oidc.clientId","jwksUrl":"oidc.jwksUrl","groupsClaim":"oidc.groupsClaim"}
